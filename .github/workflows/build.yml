name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: JipperOverlayer/JipperOverlayer.csproj
  UMM_PROJECT_PATH: JipperOverlayer.Loader.UMM/JipperOverlayer.Loader.UMM.csproj
  MELON_PROJECT_PATH: JipperOverlayer.Loader.Melon/JipperOverlayer.Loader.Melon.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout game DLLs
        uses: actions/checkout@v6
        with:
          repository: 2228293026/adofai-libs
          token: ${{ secrets.LIBS_ACCESS_TOKEN }}
          path: Libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release)
        run: |
          msbuild ${{ env.PROJECT_PATH }} -restore -p:Configuration=Release
          msbuild ${{ env.UMM_PROJECT_PATH }} -restore -p:Configuration=Release
          msbuild ${{ env.MELON_PROJECT_PATH }} -restore -p:Configuration=Release

      - name: Verify game API (signature level)
        run: |
          dotnet build tools/VerifyGameApi/VerifyGameApi.csproj -c Release --nologo
          dotnet tools/VerifyGameApi/bin/Release/net10.0/VerifyGameApi.dll Libs

      - name: Upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: JipperOverlayer
          path: |
            JipperOverlayer/bin/Release/JipperOverlayer.dll
            JipperOverlayer.Loader.UMM/bin/Release/JipperOverlayer.Loader.UMM.dll
            JipperOverlayer.Loader.Melon/bin/Release/JipperOverlayer.Loader.Melon.dll

    outputs:
      core: JipperOverlayer/bin/Release/JipperOverlayer.dll
      umm_loader: JipperOverlayer.Loader.UMM/bin/Release/JipperOverlayer.Loader.UMM.dll
      melon_loader: JipperOverlayer.Loader.Melon/bin/Release/JipperOverlayer.Loader.Melon.dll

  # 双版本兼容门禁：主构建对着 adofai-libs main（当前 r150），这里锁定 r148 基线再编一遍。
  # 源码里不允许出现任何单版本才有的符号——两个基线都必须零错误通过。
  compat-r148:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout r148 game DLLs
        uses: actions/checkout@v6
        with:
          repository: 2228293026/adofai-libs
          token: ${{ secrets.LIBS_ACCESS_TOKEN }}
          ref: 361661553c2f8de69d2c3450a360be1c7f23e0b7
          path: Libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build against r148 baseline
        run: |
          msbuild ${{ env.PROJECT_PATH }} -restore -p:Configuration=Release
          msbuild ${{ env.UMM_PROJECT_PATH }} -restore -p:Configuration=Release
          msbuild ${{ env.MELON_PROJECT_PATH }} -restore -p:Configuration=Release

      - name: Verify game API (signature level, r148)
        run: |
          dotnet build tools/VerifyGameApi/VerifyGameApi.csproj -c Release --nologo
          dotnet tools/VerifyGameApi/bin/Release/net10.0/VerifyGameApi.dll Libs

  package:
    if: github.event_name != 'pull_request'
    needs: [build, compat-r148]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: JipperOverlayer
          path: ./build

      - name: List artifact structure
        run: find build -type f

      - name: Prepare UMM mod package
        run: |
          mkdir -p output-umm
          cp build/JipperOverlayer/bin/Release/JipperOverlayer.dll output-umm/
          cp build/JipperOverlayer.Loader.UMM/bin/Release/JipperOverlayer.Loader.UMM.dll output-umm/
          cp Info.json output-umm/

      - name: Prepare MelonLoader mod package
        run: |
          mkdir -p output-melon
          cp build/JipperOverlayer/bin/Release/JipperOverlayer.dll output-melon/
          cp build/JipperOverlayer.Loader.Melon/bin/Release/JipperOverlayer.Loader.Melon.dll output-melon/

      - name: Create UMM zip
        run: cd output-umm && zip -r ../JipperOverlayer-UMM.zip . && cd ..

      - name: Create MelonLoader zip
        run: cd output-melon && zip -r ../JipperOverlayer-Melon.zip . && cd ..

      - name: Upload UMM package artifact
        uses: actions/upload-artifact@v7
        with:
          name: JipperOverlayer-UMM
          path: JipperOverlayer-UMM.zip

      - name: Upload MelonLoader package artifact
        uses: actions/upload-artifact@v7
        with:
          name: JipperOverlayer-Melon
          path: JipperOverlayer-Melon.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        variant: [UMM, Melon]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: JipperOverlayer-${{ matrix.variant }}
          path: ./

      - name: Extract release notes
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content "$root/CHANGELOG.md"
          $in = $false; $out = @()
          foreach ($line in $lines) {
            if ($line -match "^## $tag") { $in = $true; continue }
            if ($in -and $line -match "^## ") { break }
            if ($in) { $out += $line }
          }
          $body = $out -join "`n"
          if ($body.Trim() -eq "") { $body = "See CHANGELOG.md for details." }
          $body | Set-Content relnotes.md -Encoding utf8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: JipperOverlayer-${{ matrix.variant }}.zip
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: relnotes.md
          generate_release_notes: true
